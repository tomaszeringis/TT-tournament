version: '3.8'

services:
  api:
    build: .
    container_name: tournament-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/tournament.db
      - DEBUG=false
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_MODEL=llama3:latest
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python -m alembic -c tournament_platform/alembic.ini upgrade head &&
             uvicorn tournament_platform.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build: .
    container_name: tournament-web
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=sqlite:///data/tournament.db
      - DEBUG=false
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python -m alembic -c tournament_platform/alembic.ini upgrade head &&
             streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy
